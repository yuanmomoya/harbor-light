[package]
name = "harbor-light"
version = "0.1.0"
edition = "2021"
description = "可跨屏拖动的 AI 编程工具红绿灯状态悬浮窗"
license = "MIT"
publish = false
build = "build.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
notify = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSButton",
    "NSCell",
    "NSColor",
    "NSControl",
    "NSEvent",
    "NSGraphics",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSPanel",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSTrackingArea",
    "NSView",
    "NSWindow",
    "NSWorkspace",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-quartz-core",
] }
objc2-core-foundation = "0.3"
objc2-core-graphics = { version = "0.3", features = ["CGPath", "CGColor", "CGGeometry"] }
objc2-foundation = { version = "0.3", features = [
    "NSArray",
    "NSAttributedString",
    "NSDate",
    "NSDictionary",
    "NSEnumerator",
    "NSGeometry",
    "NSNotification",
    "NSObjCRuntime",
    "NSProcessInfo",
    "NSRunLoop",
    "NSString",
    "NSThread",
    "NSTimer",
    "NSUserDefaults",
    "NSValue",
    "objc2-core-foundation",
] }
objc2-quartz-core = { version = "0.3", features = [
    "CAAnimation",
    "CALayer",
    "CAMediaTiming",
    "CAMediaTimingFunction",
    "CAShapeLayer",
    "CATextLayer",
    "CATransaction",
    "CATransform3D",
    "objc2-core-foundation",
    "objc2-core-graphics",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "harbor-light"
path = "src/main.rs"
