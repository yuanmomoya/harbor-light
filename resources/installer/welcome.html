<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>Harbor Light</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; font-size: 13px; line-height: 1.55; color: #222; }
  h1 { font-size: 18px; }
</style>
</head>
<body>
<h1>Harbor Light</h1>
<p>把 Codex、Cursor 等 AI 编程工具的实时状态变成一盏可跨屏拖动的红绿灯。</p>
<p>本安装程序会：</p>
<ul>
  <li>把 <b>HarborLight.app</b> 装到「应用程序」</li>
  <li>写入 Codex 和 Cursor hooks（不覆盖你已有的 hook）</li>
  <li>配置登录时自动启动</li>
</ul>
<p>装完后新开一个 Codex 或 Cursor 会话。若 Codex 弹出「允许信任」，请点允许。</p>
</body>
</html>
